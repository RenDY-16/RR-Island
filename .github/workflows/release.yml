name: Build desktop releases

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build ${{ matrix.os }} x64 installer
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            target: --win nsis
          - os: ubuntu-latest
            target: --linux AppImage
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: npm ci
      - run: python -m pip install pyinstaller
      - run: python scripts/build_helpers.py
      - name: Build Windows installer
        if: runner.os == 'Windows'
        run: npx electron-builder --win nsis
      - name: Build Linux AppImage
        if: runner.os == 'Linux'
        run: npx electron-builder --linux AppImage
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Windows'
        with:
          name: RR-Island-Windows-x64
          path: dist/*.exe
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: runner.os == 'Linux'
        with:
          name: RR-Island-Linux-x64
          path: dist/*.AppImage
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: release-assets/**/*
